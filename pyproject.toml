[project]
name = "slack-mcp"
version = "1.0.0"
description = "FastMCP Python Slack server with direct native Slack session support"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=3.4.5",
  "httpx>=0.28.1,<1"
]

[project.scripts]
slack-mcp = "server:main"

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["backend_runtime", "server", "slack_native"]
