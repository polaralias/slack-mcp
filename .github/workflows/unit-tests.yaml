name: Unit Tests
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      SLACK_MCP_XOXC_TOKEN: ${{ secrets.SLACK_MCP_XOXC_TOKEN }}
      SLACK_MCP_XOXD_TOKEN: ${{ secrets.SLACK_MCP_XOXD_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Sync dependencies
        run: uv sync --no-dev

      - name: Compile Python sources
        run: uv run python -m compileall tests server.py slack_native.py scripts/run_server.py backend_runtime.py

      - name: Run offline verification
        run: uv run python -m unittest tests.test_runtime_config tests.test_publish_surface -v

      - name: Run live harness tests
        if: ${{ env.SLACK_MCP_XOXC_TOKEN != '' && env.SLACK_MCP_XOXD_TOKEN != '' }}
        run: uv run python -m unittest tests.test_harness_bootstrap tests.test_read_paths tests.test_fixture_sensitive_paths -v

      - name: Skip live harness tests when Slack credentials are not configured
        if: ${{ env.SLACK_MCP_XOXC_TOKEN == '' || env.SLACK_MCP_XOXD_TOKEN == '' }}
        run: echo "Skipping live harness tests because Slack browser-session credentials are not configured."
